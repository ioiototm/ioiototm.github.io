experience:
  comment: "A Research Fellow and Lead Developer for the Ages of Avebury locative AR heritage game"
  jobs:
    - title: "Research Fellow"
      org: "LoGaCulture Project · University of Southampton"
      date: "2023 - May 2026"
      bullets:
        - 'Built and shipped <a href="https://github.com/LoGaCulture/Ages-of-Avebury">Ages of Avebury</a> - a locative AR heritage game deployed at Avebury World Heritage Site with the National Trust. ~390 downloads across iOS and Android since launch.'
        - 'Designed and built <a href="https://github.com/LoGaCulture/LUTE-Server">LUTE Server</a> - a production .NET backend handling JWT auth, game telemetry, shared persistent state, and an admin panel.'
        - 'Contributed AR implementation, documentation, and bug fixes to <a href="https://github.com/LoGaCulture/LUTE">LUTE</a> - the open source Unity toolkit powering the project.'
        - 'Collaborated across a four-country EU Horizon consortium (Portugal, Ireland, Germany and UK), contributing to joint publications and shared research outputs.'
        
    - title: "PhD Researcher"
      org: "University of Southampton"
      date: "2019 - 2025"
      bullets:
        - "Designed, built, and iterated StuckInSpace from scratch in Unity - an asymmetric VR co-op game used as a research instrument across VR headset, PC, and phone modalities."
        - "Conducted two user studies with groups of participants playing the game - handling recruitment, ethics approval, session facilitation, and data analysis."
        - "Implemented real-time cross-device audio streaming (FMOD over WiFi) for the second experiment."
        - "Conducted a systematic review of immersion and embodiment literature to ground the research framework."
        - "Published at IEEE VR 2021 and CHI PLAY 2020 Doctoral Consortium."

    - title: "Android Developer - Internship"
      org: "University of Southampton"
      date: "Jul - Sep 2018"
      bullets:
        - "Built an Android computer vision application in a team of two to detect and extract text from inventory labels - used for warehouse management and stock tracking."
        - "Implemented the label detection and OCR pipeline, working through camera calibration, perspective correction, and text recognition."

projects:
  comment: "Selected shipped work and research projects"
  items:
    - name: "Ages of Avebury"
      badge: "shipped"
      badgeLabel: "SHIPPED"
      desc: "Locative AR heritage game deployed at a UNESCO World Heritage Site with the National Trust. Players explore Avebury across three time periods - Neolithic, Medieval, present day. Uses real-time ML silhouette detection to generate personalised 3D standing stones from player body shapes, which persist on the server and appear for future visitors. ~390 downloads across iOS and Android since launch."
      tech: ["Unity 6", "AR Foundation", "MediaPipe", "TensorFlow Lite", "Marching Cubes", "Mapbox", "iOS", "Android"]

    - name: "LUTE Server"
      badge: "shipped"
      badgeLabel: "SHIPPED"
      desc: "Production backend API for LoGaCulture. Handles game logging, shared variables, JWT authentication, admin panel, and the persistent stone shape social system. Deployed in production across Southampton and Bournemouth research teams."
      tech: [".NET", "SQLite", "JWT", "Docker", "REST API"]

    - name: "LUTE"
      badge: "oss"
      badgeLabel: "OPEN SOURCE"
      desc: "Unity toolkit/engine for creating narrative location-based heritage games. Contributed AR implementation, documentation, and bug fixes."
      tech: ["Unity", "C#", "AR"]

    - name: "StuckInSpace"
      badge: "research"
      badgeLabel: "RESEARCH"
      desc: "Asymmetric VR co-op game built for PhD research. Two user studies exploring how different modalities (VR headset, PC, phone) affect immersion and co-presence. Real-time audio streaming over WiFi between devices using FMOD."
      tech: ["Unity", "VR", "C#", "FMOD", "Multi-modal"]

