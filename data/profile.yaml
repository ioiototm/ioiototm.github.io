about:
  paragraphs:
    - "I'm a software engineer (and recovering academic) who also makes games, music, and art - usually not in that order. I chase whatever idea grabs me and share the messy bits under CC0 because locked-down files on a hard drive help nobody."
    - "If my half-finished experiment helps you build your masterpiece, good. That's the whole point."

