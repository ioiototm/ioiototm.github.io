passions:
  - "Story-driven games, especially ones that mess with you a bit, like **The Stanley Parable**, **Undertale/Deltarune** and **Outer Wilds**."
  - "Music on whatever's nearby: **drums**, **guitar**, **bass**, **keys**, **FL Studio**, and sometimes **drums in VR**."
  - "Weird little ideas in games and AI, mostly to see if they work."
#  - "Exploring how virtual, augmented, and mixed reality can support curiosity and collaborative play."

openSourceBeliefs:
  - "Digital stuff can be copied for free, forever. Locking it up doesn't make much sense to me."
  - "I think a lot of IP works like landlordism, just for ideas."
  - "You learn more from seeing the messy bits than the polished end result, so I leave them in."
  - "My own work is CC0. If I've used someone else's library, their licence still applies, but my part is yours."
  - "Use my stuff however you want. You can sell it or change it, I don't mind. I'd like to see what you do with it."

