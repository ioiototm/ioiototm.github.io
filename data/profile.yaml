longform:
  paragraphs:
    - "Zdravey! I'm Yoan. I make stuff, mostly for fun, and I tend to start a new thing before the last one is done, so there are more half-finished projects here than I'd like to admit. By day I'm a software engineer at the Raspberry Pi Foundation, working on Ada CS, but honestly most of what's on this site is the stuff I make in my spare time - games, music, art, little tools for one very specific problem. Before that I spent about ten years at the University of Southampton (BSc, a PhD in VR, then a postdoc making a locative AR game for the Avebury Stone Circle)."
    - "Most of it is CC0, so if you find something useful, just take it. You don't need to ask. If you make something with it, I'd love to see it!"
