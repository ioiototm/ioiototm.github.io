about:
  paragraphs:
    - "I am a creator with an academic streak. I bounce between game engines, music production, and computer science research, usually chasing whatever idea feels most interesting in the moment."
    - "I don't worry much about polish; I worry about the spark. I share my 'messy bits' and prototypes under CC0 because I want to lower the barrier for others. If my half-finished experiment helps you build your masterpiece, then the system works."

