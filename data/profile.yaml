longform:
  paragraphs:
    - "Zdravey! I'm Yoan. I'm a **Research Fellow** at the University of Southampton, but I don't really fit the typical academic mold (I think). I'm a **creator first**. I've always been chaotic, fast, and experimental—jumping from code to music to art, rarely stopping to polish things to perfection."
    - "My 'day job' is the **LoGaCulture Project**, designing a locative AR game for the Avebury Stone Circle. It's a perfect blend: using tech to make people interact with the world (and history) in playful ways. When I'm not researching, I'm usually prototyping strange ideas in Unity, jamming on my drums, or streaming. I use AI to move faster, but the goal is always the same: **get the idea out of my head and into reality.**"
    - "So yeah, look around. My code, my art, my music, my messy experiments. It's all here. **If you want it, take it.** You don't need to ask."